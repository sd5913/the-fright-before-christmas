# Add inside the EXISTING metapool.cloud HTTPS server block in BaoTa.
# This is a location snippet, not a replacement virtual-host configuration.
# Assumes BaoTa Nginx runs on the host and can reach host 127.0.0.1:3107.
# If Nginx runs in Docker, inspect its network before selecting an upstream.

location = /tfbc-api {
    return 308 /tfbc-api/;
}

location ^~ /tfbc-api/ {
    # No trailing slash: preserve /tfbc-api/ in the upstream request.
    proxy_pass http://127.0.0.1:3107;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, rather than append, user-supplied forwarded addresses.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    proxy_send_timeout 15s;
    proxy_cache off;
    proxy_intercept_errors off;
    client_max_body_size 16k;
}

<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, viewport-fit=cover">
    <title>Unity Web Player | The Fright Before Christmas</title>
  </head>
  <body style="text-align: left; padding: 0; border: 0; margin: 0; overflow: hidden; background: #000;">
    <canvas id="unity-canvas" width=1920 height=1080 tabindex="-1" style="width: 100vw; height: 100vh; display: block; background: #2F2D2E"></canvas>
    <script src="Build/game.loader.js"></script>
    <script>
      const canvas = document.querySelector("#unity-canvas");
      canvas.style.position = "fixed";
      canvas.style.left = "0";
      canvas.style.top = "0";

      createUnityInstance(canvas, {
        arguments: [],
        dataUrl: "Build/game.data",
        frameworkUrl: "Build/game.framework.js",
        codeUrl: "Build/game.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Darketomaly",
        productName: "The Fright Before Christmas",
        productVersion: "0.0.2",
        matchWebGLToCanvasSize: true,
      }).then((unityInstance) => {
      }).catch((message) => {
        alert(message);
      });
    </script>
  </body>
</html>
